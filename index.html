<!DOCTYPE html>
<html lang="bn">
<head>

<body>

  <main class="container">

    <!-- ===== Interactive History Chart Widget ===== -->
    <section class="widget-section">
      <div class="widget-card">

        <script src="https://goldratebd.com/chart.js"></script>
      </div>
    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="container">
      <p>উইজেট সরবরাহ: <a href="https://goldratebd.com" target="_blank" rel="noopener">GoldRateBD.com</a></p>
